<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="p1t p1d" font-family="Lora, Georgia, 'Times New Roman', serif">
  <title id="p1t">One narrow door, three loops</title>
  <desc id="p1d">Mail, meetings and tasks come in. Routines and conversations turn them into proposals. Every proposal goes through one door: my decision. What I decide feeds three loops back into the agent: how it guesses priority, which actions it may take alone, and what memory keeps after my review and the nightly dreaming.</desc>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#3b362f"/></marker></defs>
  <rect width="960" height="460" fill="#f6f1e7"/>
  <text x="40" y="48" font-size="22" fill="#3b362f">One narrow door, three loops</text>
  <text x="40" y="72" font-size="13.5" fill="#6b6358" font-style="italic">Everything leaves through my decision. Everything it learns comes back from there.</text>
  <g font-size="13" fill="#3b362f">
    <rect x="40" y="130" width="170" height="110" rx="12" fill="#fbf8f1" stroke="#3b362f" stroke-width="1.2"/>
    <text x="58" y="156" font-weight="600">What comes in</text>
    <text x="58" y="180" font-size="12">Mail</text>
    <text x="58" y="198" font-size="12">Meeting notes</text>
    <text x="58" y="216" font-size="12">Tasks others owe me</text>
    <rect x="260" y="130" width="190" height="110" rx="12" fill="#fbf8f1" stroke="#3b362f" stroke-width="1.2"/>
    <text x="278" y="156" font-weight="600">Routines and talk</text>
    <text x="278" y="180" font-size="12">Morning mail pass</text>
    <text x="278" y="198" font-size="12">Late-task follow-up</text>
    <text x="278" y="216" font-size="12">Note after each meeting</text>
    <rect x="500" y="130" width="180" height="110" rx="12" fill="#efe6d4" stroke="#8a5a3c" stroke-width="1.8"/>
    <text x="518" y="156" font-weight="600">My decision</text>
    <text x="518" y="180" font-size="12">Accept, change,</text>
    <text x="518" y="198" font-size="12">postpone, refuse</text>
    <text x="518" y="222" font-size="11.5" fill="#8a5a3c" font-style="italic">the only way out</text>
    <rect x="740" y="150" width="180" height="70" rx="12" fill="#fbf8f1" stroke="#3b362f" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="758" y="178" font-weight="600">A draft for me</text>
    <text x="758" y="200" font-size="12">Nothing sent in my name</text>
    <path d="M210 185H254" stroke="#3b362f" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
    <path d="M450 185H494" stroke="#3b362f" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
    <path d="M680 185H734" stroke="#3b362f" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
    <!-- loops back -->
    <rect x="130" y="320" width="220" height="80" rx="12" fill="#fbf8f1" stroke="#3b362f" stroke-width="1.2"/>
    <text x="148" y="346" font-weight="600">Priority guesses</text>
    <text x="148" y="368" font-size="12">Who it came from, what kind.</text>
    <text x="148" y="385" font-size="12">Recent decisions weigh more.</text>
    <rect x="380" y="320" width="220" height="80" rx="12" fill="#fbf8f1" stroke="#3b362f" stroke-width="1.2"/>
    <text x="398" y="346" font-weight="600">Permission rules</text>
    <text x="398" y="368" font-size="12">Five clean yeses: it asks</text>
    <text x="398" y="385" font-size="12">to do that one thing alone.</text>
    <rect x="630" y="320" width="230" height="80" rx="12" fill="#fbf8f1" stroke="#3b362f" stroke-width="1.2"/>
    <text x="648" y="346" font-weight="600">Memory</text>
    <text x="648" y="368" font-size="12">Candidates I review, merged</text>
    <text x="648" y="385" font-size="12">in the nightly dreaming.</text>
    <path d="M560 240C560 280 260 280 245 314" stroke="#8a5a3c" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
    <path d="M590 240C590 280 490 280 490 314" stroke="#8a5a3c" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
    <path d="M620 240C620 280 740 280 745 314" stroke="#8a5a3c" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
    <path d="M860 360C910 360 910 110 360 110L360 124" stroke="#6b6358" stroke-width="1.1" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
    <text x="640" y="104" font-size="11.5" fill="#6b6358" font-style="italic">what it knows shapes the next round of proposals</text>
  </g>
</svg>
