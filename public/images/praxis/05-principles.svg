<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 360" width="672" height="360" role="img" aria-label="Seven recurring rules in three groups, what counts as true, who acts, and how it gets better, all pointing to me as the gate" font-family="Source Serif 4, Iowan Old Style, Palatino, Georgia, serif"><title>Seven recurring rules in three groups, what counts as true, who acts, and how it gets better, all pointing to me as the gate</title><text x="40" y="22" text-anchor="start" font-size="12.5" fill="#5c554c" letter-spacing="0.06em">THE RULES THAT KEPT COMING BACK</text><rect x="236" y="300" width="200" height="46" rx="6" fill="#7a4032" fill-opacity="0.1" stroke="#d3c4b0"/><text x="336" y="322" text-anchor="middle" font-size="16" fill="#2c261f" font-weight="600">Me, as the gate</text><text x="336" y="339" text-anchor="middle" font-size="12.5" fill="#5c554c">decisions stay mine</text><text x="128.0" y="52" text-anchor="middle" font-size="15" fill="#2c261f" font-style="italic">What counts as true</text><rect x="40" y="68" width="176" height="46" rx="6" fill="#faf6ef" stroke="#d3c4b0"/><text x="128.0" y="96" text-anchor="middle" font-size="14" fill="#2c261f">Zero guessing</text><rect x="40" y="130" width="176" height="46" rx="6" fill="#faf6ef" stroke="#d3c4b0"/><text x="128.0" y="158" text-anchor="middle" font-size="14" fill="#2c261f">One source of truth</text><path d="M128.0,176 C128.0,216 336,270 336,300" fill="none" stroke="#7a4032" stroke-width="1.2" stroke-opacity="0.7"/><text x="336.0" y="52" text-anchor="middle" font-size="15" fill="#2c261f" font-style="italic">Who acts</text><rect x="248" y="68" width="176" height="46" rx="6" fill="#faf6ef" stroke="#d3c4b0"/><text x="336.0" y="96" text-anchor="middle" font-size="14" fill="#2c261f">Propose, don't act</text><rect x="248" y="130" width="176" height="46" rx="6" fill="#faf6ef" stroke="#d3c4b0"/><text x="336.0" y="158" text-anchor="middle" font-size="14" fill="#2c261f">Preparer, not advisor</text><path d="M336.0,176 C336.0,216 336,270 336,300" fill="none" stroke="#7a4032" stroke-width="1.2" stroke-opacity="0.7"/><text x="544.0" y="52" text-anchor="middle" font-size="15" fill="#2c261f" font-style="italic">How it gets better</text><rect x="456" y="68" width="176" height="46" rx="6" fill="#faf6ef" stroke="#d3c4b0"/><text x="544.0" y="96" text-anchor="middle" font-size="14" fill="#2c261f">Loops that improve</text><rect x="456" y="130" width="176" height="46" rx="6" fill="#faf6ef" stroke="#d3c4b0"/><text x="544.0" y="158" text-anchor="middle" font-size="14" fill="#2c261f">A written decision book</text><rect x="456" y="192" width="176" height="46" rx="6" fill="#faf6ef" stroke="#d3c4b0"/><text x="544.0" y="220" text-anchor="middle" font-size="13" fill="#2c261f">The builder never grades itself</text><path d="M544.0,238 C544.0,278 336,270 336,300" fill="none" stroke="#7a4032" stroke-width="1.2" stroke-opacity="0.7"/></svg>