<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 430" width="672" height="430" role="img" aria-label="Privacy filter: 2,256 session files, 281 mine, 225 kept, 1,390 prompts, with security prompts counted but never stored" font-family="Source Serif 4, Iowan Old Style, Palatino, Georgia, serif"><title>Privacy filter: 2,256 session files, 281 mine, 225 kept, 1,390 prompts, with security prompts counted but never stored</title><text x="40" y="22" text-anchor="start" font-size="12.5" fill="#5c554c" letter-spacing="0.06em">WHAT THE FILTER LETS THROUGH</text><path d="M40,36 L632,36 L610,100 L62,100 Z" fill="#faf6ef" fill-opacity="1" stroke="#d3c4b0"/><text x="336" y="62" text-anchor="middle" font-size="17" fill="#2c261f">2,256 session files</text><text x="336" y="83" text-anchor="middle" font-size="13" fill="#5c554c">everything on disk, first month to last</text><path d="M62,108 L610,108 L588,172 L84,172 Z" fill="#7a4032" fill-opacity="0.06" stroke="#d3c4b0"/><text x="336" y="134" text-anchor="middle" font-size="17" fill="#2c261f">281 are mine</text><text x="336" y="155" text-anchor="middle" font-size="13" fill="#5c554c">1,975 were my work agent's engine calling the model, so they go</text><path d="M84,180 L588,180 L566,244 L106,244 Z" fill="#7a4032" fill-opacity="0.12" stroke="#d3c4b0"/><text x="336" y="206" text-anchor="middle" font-size="17" fill="#2c261f">225 kept</text><text x="336" y="227" text-anchor="middle" font-size="13" fill="#5c554c">56 day-job sessions only looked things up and never edited a file</text><path d="M106,252 L566,252 L544,328 L128,328 Z" fill="#7a4032" fill-opacity="0.2" stroke="#d3c4b0"/><text x="336" y="278" text-anchor="middle" font-size="17" fill="#2c261f">1,390 prompts I typed</text><text x="336" y="299" text-anchor="middle" font-size="13" fill="#5c554c">152 touching security: counted, never stored</text><text x="336" y="316" text-anchor="middle" font-size="13" fill="#5c554c">a secret was masked in 17 of the rest</text><rect x="200" y="342" width="272" height="44" rx="5" fill="#faf6ef" stroke="#7a4032" stroke-dasharray="4 4"/><text x="336" y="370" text-anchor="middle" font-size="15.5" fill="#2c261f">Findings I can write about</text><line x1="336" y1="328" x2="336" y2="340" stroke="#7a4032" stroke-width="1.4"/><text x="40" y="416" text-anchor="start" font-size="13" fill="#5c554c" font-style="italic">Tool calls keep a name, a pass or fail, and an output size. Never the output. One rules file; rerun, same result.</text></svg>